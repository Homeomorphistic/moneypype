[project]
name = "moneypype"
version = "0.1.0"
description = ""
authors = [
    {name = "Homeomorphistic",email = "chmiela.bartosz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars (>=1.39.0,<2.0.0)",
    "duckdb (>=1.5.2,<2.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "pandera (>=0.31.1,<0.32.0)",
    "fastexcel (>=0.11.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "openpyxl (>=3.0.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[project.scripts]
moneypype = 'moneypype.console:main'